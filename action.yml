notes: |
  ## PyGo CLI Installation Complete!
  
  ## Quick Start
  1. Verify installation: `pygo --version`
  2. Check your environment: `pygo doctor`
  3. Create a new project: `pygo new my-app`
  4. Start development: `cd my-app && pygo dev`
  
  ## Documentation
  - Full docs: https://pygo.dev/docs
  - API Reference: https://pygo.dev/docs/api
  - Community: https://github.com/Ander-Labs/pygo/discussions
  
  ## Next Steps
  \`\`\`bash
  pygo doctor    # Check environment
  pygo new .     # Create new project in current directory
  pygo build     # Build production binary
  pygo db migrate # Run database migrations
  \`\`\`
 
