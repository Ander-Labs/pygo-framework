# GoReleaser configuration for PyGo Framework
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: pygo
    binary: pygo
    main: ./cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tar
    name_template: "pygo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
  - id: zip
    name_template: "pygo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: false

changelog:
  use: github-native
  sort: asc
  filters:
    exclude:
      - "Merge pull request"
      - "Merge branch"
      - "docs:"
      - "chore:"
      - "ci:"
