# PyGo Project Configuration
# Generated by `pygo new`

[project]
name = "{{.ProjectName}}"
version = "0.1.0"
description = "A PyGo application"
author = "{{.Author}}"
license = "AGPL-3.0"

[server]
host = "0.0.0.0"
port = 8080
debug = true

[database]
driver = "sqlite"
path = "./data/app.db"

[auth]
jwt_secret = "CHANGE_ME_IN_PRODUCTION"
session_secret = "CHANGE_ME_IN_PRODUCTION"

[logging]
level = "info"
format = "text"